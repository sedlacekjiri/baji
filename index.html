<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Báji</title>
<meta name="description" content="Pro Báru.">
<meta name="theme-color" content="#0b0b0b">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/img/my.jpg">
<link rel="stylesheet" href="css/style.css">
<noscript><style>#gate{display:none!important} #site{display:flex!important}</style></noscript>
<!-- Privacy-friendly analytics by Plausible -->
<script async src="https://plausible.io/js/pa-UN9_I7LEbrVxS5h8LGnaJ.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>
</head>
<body>

<!-- ===================== BRÁNA S HESLEM ===================== -->
<div id="gate" class="gate">
  <main class="gate__card">
    <h1 class="gate__title">Ahoj, Báro</h1>
    <form id="gate-form" class="gate__form" autocomplete="off" novalidate>
      <label for="gate-answer" class="gate__question">
        Které zvíře je v našem vztahu nejvíce připomínané?
      </label>
      <input
        type="text"
        id="gate-answer"
        name="answer"
        class="gate__input"
        placeholder="odpověď"
        aria-describedby="gate-error"
        required
      >
      <button type="submit" class="gate__button">Odemknout</button>
      <p id="gate-error" class="gate__error" role="alert" aria-live="polite"></p>
    </form>
  </main>
</div>

<!-- ===================== HLAVNÍ STRÁNKA ===================== -->
<div id="site" class="site" hidden>
  <figure class="photo">
    <img src="assets/img/my.jpg" alt="My dva za oknem" width="1203" height="624">
  </figure>

  <!-- TEXT – stačí přepsat tyhle tři řádky -->
  <section class="words">
    <p class="words__eyebrow">Báro,</p>
    <h1 class="words__title">Někdy musíš něco ztratit, <br>abys pochopil, co pro tebe znamená.</h1>
    <p class="words__line">Já už to vím. A tohle ještě není konec.</p>
  </section>
</div>

<script src="js/script.js"></script>
</body>
</html>
