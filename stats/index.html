<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Báji – statistiky</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f4f3f0;
    --card: #ffffff;
    --fg: #141414;
    --muted: #7a7a7a;
    --line: #e2e0db;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 24px; font-size: 1.4rem; font-weight: 500; }
  button, select, input {
    font: inherit;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--line);
    padding: 8px 12px;
    border-radius: 0;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--fg); }
  .login { display: flex; gap: 8px; flex-wrap: wrap; }
  .login input { flex: 1; min-width: 180px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 24px; }
  .bar .spacer { flex: 1; }
  .msg { color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 32px; }
  .tile { background: var(--card); border: 1px solid var(--line); padding: 16px; }
  .tile b { display: block; font-size: 1.6rem; font-weight: 500; }
  .tile span { color: var(--muted); font-size: 0.85rem; }
  .visit { background: var(--card); border: 1px solid var(--line); padding: 14px 16px; margin-bottom: 8px; }
  .visit__top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .visit__when { font-weight: 500; }
  .visit__dur { font-variant-numeric: tabular-nums; }
  .visit__meta { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
  .tag { display: inline-block; border: 1px solid var(--fg); padding: 0 6px; font-size: 0.75rem; margin-left: 6px; }
  .tag--muted { border-color: var(--line); color: var(--muted); }
  @media (max-width: 600px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Báji – statistiky</h1>

  <form id="login" class="login" hidden>
    <input id="key" type="password" placeholder="Heslo ke statistikám" autocomplete="current-password">
    <button type="submit">Zobrazit</button>
  </form>

  <div id="app" hidden>
    <div class="bar">
      <select id="days" aria-label="Období">
        <option value="1">Dnes</option>
        <option value="7">7 dní</option>
        <option value="30" selected>30 dní</option>
        <option value="90">90 dní</option>
      </select>
      <button id="reload" type="button">Obnovit</button>
      <span class="spacer"></span>
      <button id="ignore" type="button"></button>
      <button id="logout" type="button">Odhlásit</button>
    </div>
    <div class="tiles" id="tiles"></div>
    <div id="list"></div>
  </div>

  <p id="msg" class="msg"></p>
</div>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} },
  };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function formatDuration(sec) {
    sec = Math.round(sec || 0);
    if (sec < 60) return sec + " s";
    const m = Math.floor(sec / 60), s = sec % 60;
    if (m < 60) return m + " min " + String(s).padStart(2, "0") + " s";
    return Math.floor(m / 60) + " h " + (m % 60) + " min";
  }
  const formatDate = (iso) => new Date(iso).toLocaleString("cs-CZ", {
    weekday: "short", day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit",
  });
  const pageName = (p) => p === "/" ? "hlavní stránka" : p.replace(/^\/archive\//, "archiv: ").replace(/\/$/, "");

  function renderIgnore() {
    const ignored = store.get("bj_ignore") === "1";
    $("ignore").textContent = ignored ? "Tento prohlížeč se neměří ✓" : "Neměřit tento prohlížeč";
  }

  async function load() {
    const key = store.get("bj_key");
    if (!key) { $("login").hidden = false; $("app").hidden = true; return; }
    $("msg").textContent = "Načítám…";
    try {
      const res = await fetch("/api/stats?days=" + $("days").value, { headers: { "x-stats-key": key }, cache: "no-store" });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        if (res.status === 401) store.set("bj_key", null);
        $("app").hidden = true;
        $("login").hidden = res.status !== 401;
        $("msg").textContent = data.error || "Chyba " + res.status;
        return;
      }
      $("login").hidden = true;
      $("app").hidden = false;
      $("msg").textContent = "";
      render(data.visits || []);
    } catch (e) {
      $("msg").textContent = "Statistiky nejdou načíst (funguje to jen na nasazeném webu).";
    }
  }

  function render(visits) {
    const visitors = {};
    visits.forEach((v) => { visitors[v.visitor] = (visitors[v.visitor] || 0) + 1; });
    const total = visits.reduce((a, v) => a + (v.duration || 0), 0);
    const unlocked = visits.filter((v) => v.unlocked).length;

    $("tiles").innerHTML = [
      [visits.length, "návštěv"],
      [Object.keys(visitors).length, "různých lidí (prohlížečů)"],
      [formatDuration(visits.length ? total / visits.length : 0), "průměrná doba"],
      [unlocked, "zadalo správné heslo"],
    ].map(([n, label]) => `<div class="tile"><b>${esc(n)}</b><span>${esc(label)}</span></div>`).join("");

    if (!visits.length) { $("list").innerHTML = '<p class="msg">Zatím žádné návštěvy.</p>'; return; }

    $("list").innerHTML = visits.map((v) => {
      const place = [v.city, v.region, v.country].filter(Boolean).join(", ") || "neznámé místo";
      const pages = Object.entries(v.pages || {}).map(([p, s]) => `${esc(pageName(p))} (${formatDuration(s)})`).join(" · ");
      const who = "návštěvník " + esc(String(v.visitor).slice(0, 4).toUpperCase());
      const again = visitors[v.visitor] > 1 ? `<span class="tag tag--muted">${visitors[v.visitor]}× v období</span>` : "";
      const lock = v.unlocked ? '<span class="tag">odemkl/a</span>' : '<span class="tag tag--muted">jen brána</span>';
      let ref = "přímo / z odkazu v aplikaci";
      if (v.ref) { try { ref = new URL(v.ref).host; } catch (e) { ref = v.ref; } }
      return `<article class="visit">
        <div class="visit__top">
          <span class="visit__when">${esc(formatDate(v.start))}${lock}</span>
          <span class="visit__dur">${formatDuration(v.duration)}</span>
        </div>
        <div class="visit__meta">${esc(place)} · ${esc(v.device)}, ${esc(v.os)}, ${esc(v.browser)}</div>
        <div class="visit__meta">${pages || "—"}</div>
        <div class="visit__meta">${who}${again} · přišel/a: ${esc(ref)}</div>
      </article>`;
    }).join("");
  }

  $("login").addEventListener("submit", (e) => {
    e.preventDefault();
    store.set("bj_key", $("key").value.trim());
    // Kdo se dívá na statistiky, ten se sám neměří.
    store.set("bj_ignore", "1");
    renderIgnore();
    load();
  });
  $("days").addEventListener("change", load);
  $("reload").addEventListener("click", load);
  $("logout").addEventListener("click", () => { store.set("bj_key", null); $("key").value = ""; load(); });
  $("ignore").addEventListener("click", () => {
    store.set("bj_ignore", store.get("bj_ignore") === "1" ? null : "1");
    renderIgnore();
  });

  renderIgnore();
  load();
})();
</script>
</body>
</html>
